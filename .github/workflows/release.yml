name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate version/tag consistency
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(cat VERSION)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match VERSION ${VERSION}"
            {
              echo "## Release Blocked: Version Mismatch"
              echo ""
              echo "- Git tag: \`${TAG}\`"
              echo "- VERSION file: \`${VERSION}\`"
              echo ""
              echo "The release was intentionally blocked because tag and VERSION must match."
              echo ""
              echo "### How to fix"
              echo "1. Update plugin version metadata and \`VERSION\` to the same value."
              echo "2. Commit the fix to \`main\`."
              echo "3. Create and push the matching tag again."
              echo ""
              echo "Expected rule:"
              echo "- tag \`vX.Y.Z\`"
              echo "- \`VERSION\` file \`X.Y.Z\`"
            } >> \"$GITHUB_STEP_SUMMARY\"
            exit 1
          fi

      - name: Build plugin ZIP
        run: |
          chmod +x scripts/build-plugin.sh
          ./scripts/build-plugin.sh

      - name: Create GitHub release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
